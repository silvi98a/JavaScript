<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cálculo de salario</title>
  </head>

  <body>
    <h1>Calcula tu salario</h1>

    <form id="formulario">
      <p>Nombre: <input type="text" id="nombre" /></p>
      <p>Apellidos: <input type="text" id="apellidos" /></p>
      <p>Edad: <input type="number" id="edad" /></p>
      <p>Salario: <input type="number" id="salario" /></p>
    </form>

    <button id="boton">Enviar formulario</button> <!-- Tiene que coincidir con el boton del .js-->
  
  <!--
    <div id="resultado"></div> --> 
    <!-- Se conecta con la línea 36 del .js
    El div es un contenedor vacío en tu HTML. Es como dejar un espacio 
    reservado en la pared para colgar un cuadro más tarde.-->


    <p id="resNombre"></p>
    <p id="resApellidos"></p>
    <p id="resEdad"></p>          <!-- Se conecta con la línea 47 del .js-->
    <p id="resSalario"></p>
    <p id="resNuevoSalario"></p>


    <script src="./Tarea_CalculoSalario.js"></script>
  </body>
</html>
